services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipsaerp
      POSTGRES_USER: aipsaerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Internal-only: reachable by the api service over the compose network as
    # `postgres:5432`. No host port is published, so the DB is not exposed externally.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipsaerp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Separate database for the home-schooling product, so an ERP DB problem cannot
  # affect home-schooling and vice-versa. Internal-only, like the ERP postgres.
  postgres-hs:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipsahs
      POSTGRES_USER: aipsahs
      POSTGRES_PASSWORD: ${HS_POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_hs_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipsahs"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://aipsaerp:${POSTGRES_PASSWORD:-password}@postgres:5432/aipsaerp
      # Prisma uses directUrl for migrations. Pin it to the internal DB too, or the
      # .env's Neon DIRECT_URL (injected via env_file) would send migrations to the
      # cloud while the app runs against local Postgres — a split-brain setup.
      DIRECT_URL: postgresql://aipsaerp:${POSTGRES_PASSWORD:-password}@postgres:5432/aipsaerp
      # Separate home-schooling database (own Postgres service).
      HS_DATABASE_URL: postgresql://aipsahs:${HS_POSTGRES_PASSWORD:-password}@postgres-hs:5432/aipsahs
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    volumes:
      # Persist uploaded files (STORAGE_DRIVER=local) across container rebuilds.
      - uploads_data:/app/uploads
    # Internal-only: the browser never hits the API directly — the web service
    # proxies every /api/* call over the compose network as `api:5000`.
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-hs:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/web/.env.local
    environment:
      API_URL: http://api:5000/api
    # Public entry point for the school ERP. Caddy on the host reverse-proxies the
    # ERP domain to this port.
    ports:
      - "3121:3000"
    depends_on:
      - api

  # Home-schooling frontend — a separate B2C app. Runs as its own container so a
  # crash here cannot take the ERP web container down (and vice-versa). It shares
  # the same API and database; Caddy on the host routes the home-schooling domain
  # to this port.
  homeschool:
    build:
      context: ./apps/homeschool
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-side proxy target (apps/homeschool/app/api/proxy). The browser only
      # ever calls /api/proxy/* on this app; it forwards to the internal API.
      API_URL: http://api:5000/api
    ports:
      - "3122:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  postgres_hs_data:
  uploads_data:
