services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipsaerp
      POSTGRES_USER: aipsaerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Internal-only: reachable by the api service over the compose network as
    # `postgres:5432`. No host port is published, so the DB is not exposed externally.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipsaerp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Single project-level env file (./.env, next to this compose file). Holds all
    # app secrets (JWT, SMTP, Razorpay, Firebase, MSG91, HS_API_URL/HS_ADMIN_TOKEN,
    # etc.) — see .env.example. The container-network values below are set explicitly
    # so they always win over anything in .env.
    env_file: .env
    environment:
      # Point Prisma at the internal postgres service (built from POSTGRES_PASSWORD
      # in ./.env). directUrl is pinned to the same internal DB so migrations and the
      # app never split-brain across two databases.
      DATABASE_URL: postgresql://aipsaerp:${POSTGRES_PASSWORD:-password}@postgres:5432/aipsaerp
      DIRECT_URL: postgresql://aipsaerp:${POSTGRES_PASSWORD:-password}@postgres:5432/aipsaerp
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    volumes:
      # Persist uploaded files (STORAGE_DRIVER=local) across container rebuilds.
      - uploads_data:/app/uploads
    # Internal-only: the browser never hits the API directly — the web service
    # proxies every /api/* call over the compose network as `api:5000`.
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    # The web container only needs API_URL — the browser calls /api/proxy on this
    # app, which forwards to the internal api service. No env file needed here.
    environment:
      API_URL: http://api:5000/api
    # Public entry point for the school ERP. Caddy on the host reverse-proxies the
    # ERP domain to this port.
    ports:
      - "3121:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
