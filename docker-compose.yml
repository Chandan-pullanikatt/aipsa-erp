version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipsaerp
      POSTGRES_USER: aipsaerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipsaerp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://aipsaerp:${POSTGRES_PASSWORD:-password}@postgres:5432/aipsaerp
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/web/.env.local
    environment:
      API_URL: http://api:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
