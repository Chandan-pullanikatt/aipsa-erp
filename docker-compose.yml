services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipsaerp
      POSTGRES_USER: aipsaerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Internal-only: reachable by the api service over the compose network as
    # `postgres:5432`. No host port is published, so the DB is not exposed externally.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipsaerp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://aipsaerp:${POSTGRES_PASSWORD:-password}@postgres:5432/aipsaerp
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    volumes:
      # Persist uploaded files (STORAGE_DRIVER=local) across container rebuilds.
      - uploads_data:/app/uploads
    # Internal-only: the browser never hits the API directly — the web service
    # proxies every /api/* call over the compose network as `api:5000`.
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/web/.env.local
    environment:
      API_URL: http://api:5000/api
    # The single public entry point for the whole project.
    ports:
      - "3121:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
